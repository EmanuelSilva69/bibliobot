services:
  bibliobot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bibliobot-ufma
    ports:
      - "18000:8000"
    environment:
      LLM_BACKEND: ollama
      LLM_URL: http://host.docker.internal:11434
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: hf.co/bartowski/Qwen2.5.1-Coder-7B-Instruct-GGUF:Q4_K_M
      EVOLUTION_API_URL: "http://127.0.0.1:9000/api/messages"
      EVOLUTION_API_TOKEN: ${EVOLUTION_API_TOKEN:-evolution-test-token}
      # A comunicação interna no Docker usa a porta 8080 do container
      EVOLUTION_BASE_URL: "http://evolution-api:8080" 
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-evolution-test-token}
      EVOLUTION_INSTANCE_NAME: "bibliobot"
      EVOLUTION_TIMEOUT: "20"
      SEARXNG_URL: http://searxng:8080
      MAX_RECOMMENDATIONS: 3
      HTTP_TIMEOUT: 60
      ALLOWED_GROUP_JID: "${ALLOWED_GROUP_JID}"
      BOT_JID: "${BOT_JID}"
      ALLOWED_NUMBERS: "${ALLOWED_NUMBERS}"
    volumes:
      - ./app:/workspace/app
    depends_on:
      - searxng
      - evolution-api


  # ---------------------------------------------------
  # STACK EVOLUTION API (Isolada e Estabilizada)
  # ---------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api-local
    ports:
      # Expondo a porta 8088 no host porque 8080 já está ocupada localmente
      - "8088:8080"
    environment:
      SERVER_URL: http://localhost:8088
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:-evolution-test-token}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:postgres@evolution-postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      WEBSOCKET_ENABLED: "false"
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    volumes:
      - evolution_api_data:/evolution/instances

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis-local
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # STACK SEARXNG
  # ---------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: searxng-local
    ports:
      - "18081:8080"
    environment:
      BASE_URL: http://localhost:18081/
      INSTANCE_NAME: bibliobot-searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: searxng-redis

volumes:
  evolution_api_data:
  evolution_postgres_data:
  evolution_redis_data: